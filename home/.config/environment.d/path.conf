# PATH for the systemd --user manager. herdr-core snapshots the manager
# env into its runtime units (hc-hold/hc-serve) and those terminals
# spawn pi: pi and the agent tooling (hc, herdr, agent-browser) live in
# ~/.local/bin, so the PAM default PATH (/usr/local/bin:/usr/bin) makes
# every hc spawn die with "pi exited before its first status report".
PATH=/home/esteban/.local/bin:/home/esteban/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/usr/bin:/bin
