# Without this, Ghostty alternate-scroll converts wheel events to Up/Down
# arrow keys (tmux runs alt-screen without mouse reporting), so the wheel
# moved the pi input cursor instead of scrolling pane history.
set -g mouse on

# For Pi: forward true CSI-u for modified keys (shift+enter vs alt+enter)
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# Move the status bar to the top
#set -g status-position top

# Customize how active and inactive windows look
set -g window-status-format " #I:#W "
set -g window-status-current-format " [#I:#W] "

# Optional: Make window navigation feel like browser tabs (Alt + h/l)
bind -n M-h previous-window
bind -n M-l next-window
